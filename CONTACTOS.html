            <h2>Contáctanos</h2>
            <p class="subtitle">¿Preguntas, inquietudes, comentarios?
                Tú hablas, nosotros te escuchamos

            <label for="name"></i>Nombre y Apellidos:</label>
            <input type="text" name="name" id="name" placeholder="ingresa tus nombres" required>

            <input type="email" name="email" id="email" placeholder="ingresa tus correo" required>



            <label for="message"></i>Mensaje:</label>
            <textarea name="message" id="message" rows="4"
             placeholder="¡Cuéntanos!"></textarea>

             </center>

             </button>
